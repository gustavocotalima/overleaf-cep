networks:
  coolify:
    external: true

services:
  overleaf:
    restart: always
    build:
      context: .
      dockerfile: server-ce/Dockerfile.coolify
    ports:
      - "80"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    stop_grace_period: 60s
    volumes:
      - overleaf-data:/var/lib/overleaf
      - texlive-data:/usr/local/texlive
    environment:
      OVERLEAF_APP_NAME: Overleaf Community Edition
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      ENABLED_LINKED_FILE_TYPES: 'project_file,project_output_file'
      ENABLE_CONVERSIONS: 'true'
      EMAIL_CONFIRMATION_DISABLED: 'true'
      AUTO_INSTALL_PACKAGES: 'true'
    networks:
      coolify:
        ipv4_address: 172.19.0.105

  mongo:
    restart: always
    image: mongo:8.0
    command: '--replSet overleaf'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'overleaf', members: [{ _id: 0, host: 'mongo:27017' }] }) }", "--quiet"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - coolify

  redis:
    restart: always
    image: redis:6.2
    volumes:
      - redis-data:/data
    networks:
      - coolify

volumes:
  overleaf-data:
  mongo-data:
  redis-data:
  texlive-data:
